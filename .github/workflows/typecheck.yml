name: Typecheck

# `next build` skips type-checking (typescript.ignoreBuildErrors in
# next.config.ts), so type errors are caught here instead.
on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main, "release/**"]

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck
