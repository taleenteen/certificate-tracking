services:
  frontend:
    container_name: gov-nextjs-frontend
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOV_API_URL: ${GOV_API_URL:-}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4003
      HOSTNAME: 0.0.0.0
      GOV_API_URL: ${GOV_API_URL:-}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
    ports:
      - "${FRONTEND_PORT:-4003}:4003"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4003').then((res)=>process.exit(res.ok?0:1\
            )).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - gov_smartcity

networks:
  gov_smartcity:
    external: true
    name: ${DOCKER_EXTERNAL_NETWORK:-gov_smartcity}
